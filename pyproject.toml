[project]
name = "fitness-bot"
version = "0.1.0"
description = "WhatsApp fitness & nutrition tracking bot"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "anthropic>=0.42.0",
    "twilio>=9.4.0",
    "openai>=1.58.0",
    "pydub>=0.25.1",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "cryptography>=44.0.0",
    "pillow>=11.0.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
